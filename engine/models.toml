[rejected.cache_reuse]
setting  = "--cache-reuse 256"
verdict  = "DEAD — remove on sight"
match    = ["--cache-reuse"]
evidence = "Every serve logs 'cache_reuse is not supported by this context, it will be disabled'. Gated on llama_memory_can_shift(), false for these models' attention geometry. It was present in five serve lines and had never done anything in any of them."

[rejected.adaptive_speculation]
setting  = "--spec-draft-adaptive (LaurentZuijdwijk/llama.cpp b10641)"
verdict  = "NO GAIN on discursive generation, at any n-max"
match    = ["--spec-draft-adaptive"]
evidence = "Measured 2026-08-26 on the pinned Qwen3.8-27B UD-Q6_K_XL at 29k, production config, 8 samples per arm per workload. Controlled contrast (one binary, one flag): discursive -1.6% decode, enumerative +6.4%. At the fork's own MTP setting (n-min 2 n-max 4): -1.7% and +1.6%. The controller is live and behaves as designed — mean draft 2.98 fixed, 3.23/5.15 adaptive — but output tokens per target forward pass, which is deterministic and has no clock in it, moves +0.6%/-1.8% on discursive text: it buys nothing mechanically. Enumerative gains come with a 9-point acceptance drop (p=0.0011), which is the fork's own warning that for MTP the controller maximises accepted tokens rather than throughput. Caveat on power: 2 visits per arm, so the blocked-permutation floor is p=1/3 and the minimum detectable effect ~5%. Harness evaluations/models/adaptive-spec-ab.sh; working in WORK/model-serving.md 2026-08-25 (adaptive-spec)."

[rejected.laurent_fork_for_ds4]
setting  = "LaurentZuijdwijk/llama.cpp b10641 as ds4's engine"
verdict  = "33-37% SLOWER than the Nathan pin — do not swap"
match    = ["adaptive-fork/b10641"]
evidence = "Measured 2026-08-26 head-to-head on ds4 UD-IQ3_XXS at 28k: Nathan v0.6.1 prefill 203.8 / decode 17.33-17.84 (reproducing this file's recorded 17.28 +- 0.02), Laurent b10641 prefill 137.4 / decode 11.05-11.21. Binary and driver moved together (Nathan's bundled RADV vs host Mesa 26.1.5); a driver-isolation arm exists in the harness and was not run. Nathan's fork is Strix MoE/FA shader work with seven GGML_VK_MMID_* gates on by default, which is where ds4's MoE lives. On the DENSE Qwen3.8-27B the same Laurent build is +12.5% prefill, so the sign is model-shape-dependent, not general. Harness evaluations/models/ds4-fork-ladder.sh."

[rejected.dflash]
setting  = "--spec-type draft-dflash (Laguna, poolside fork build)"
verdict  = "NET LOSS on this hardware"
match    = ["draft-dflash"]   # NOT "--spec-type": draft-mtp on the 35B is a net WIN (~52% acceptance)
evidence = "Validated 2026-07-27: draft acceptance 17.2% (121/705, mean accepted length 1.68) → 21.4 tok/s against 30.8 without. A 31% slowdown. The build works; the draft is simply not accepted often enough to pay for verification. Also costs ~7.8 GiB, not the 1.1 GiB of its weights, because it needs its own KV cache. Retest only at --spec-draft-n-max 15 (the model's own generation_config value) with a Q4_K_M draft, and only after the draft is regenerated against the corrected weights."

[rejected.cache_ram_raise]
setting  = "--cache-ram 16384 (raising the prompt-cache budget above the 8192 MiB default)"
verdict  = "OOM-KILLS THE SERVER at 262144 context"
match    = ["--cache-ram 16384", "--cache-ram 24576"]
evidence = "Tried 2026-07-27 to recover re-prefill from the 67 evictions logged in the laguna-ctx run. The kernel OOM-killer took llama-server 59 minutes in, at total-vm 97.8 GiB; r1 completed, r2/r3 were all 'Connection error'. THE REASONING ERROR IS THE REUSABLE PART: the flag was accepted on the argument that it spends *host* RAM rather than VRAM, so there was headroom. On Strix Halo the GPU memory is UNIFIED — GTT *is* system RAM — so there is no second pool to spend. Laguna at 262144 already occupies 81.8 GiB of 124 GB. Any future rise must be costed against GTT, not against nominally free host RAM."

[rejected.kv_quantisation]
setting  = "--cache-type-k/-v q8_0"
verdict  = "WORSE AND SLOWER — do not use for recall"
match    = ["--cache-type-k q8_0", "--cache-type-v q8_0", "-ctk q8_0", "-ctv q8_0"]
evidence = "Directly measured on Laguna (25 coding tasks): q8_0 KV gave 76.0% success vs 88.0% full, AND 29% more wall time. Inverts the usual intuition. For a recall task where fabrication is the cardinal sin this is a clear no — and we do not need it: 48.8 KiB/token shows llama.cpp already exploits Laguna's sliding-window attention (only 12 of 48 layers hold full-length KV)."

[rejected.presence_penalty]
setting  = "presence_penalty 1.5 (Qwen3.5/3.6 card recommendation for general thinking tasks)"
verdict  = "DISQUALIFIED for recall"
match    = ["--presence-penalty 1.5"]
evidence = "runs/35b-think vs runs/35b-think-nopp (3x each, 2026-07-27): with presence 1.5, Q4 — the known-answer Librela date regression — scored 0/3; without it, 3/3. Penalties key on token identity and eat repeated dates, entity names and wikilinks, all of which are scored metrics here. Officially recommended and empirically wrong for this workload."

[rejected.low_temperature]
setting  = "temp 0.6-0.7 (Laguna and the 122B)"
verdict  = "COSTS FAITHFULNESS AND LANDMARKS"
match    = ["--temp 0.6", "--temp 0.7"]
evidence = "Laguna at temp 0.7 produced factual corruption – 'Metzinger'→'Metzberg', a 2026 note dated 2024, the long-tail mode-collapse signature (2026-07 Laguna record, git history). The 122B at temp 0.6 (the card's *precise-coding* line, which is also what its shipped generation_config carries) missed three gold landmarks that temp 1.0 recovers: Q5 2026-03-12 0/3→2/3, Q6 2019-03-19 0/3→1/3, Q6 2025-10-15 0/3→2/3. For BOTH models: recall is a general task, not a coding one."

[rejected.prompt_search_bound]
setting  = "A prompt-level 'stop searching after ~N tool calls' instruction"
verdict  = "FAILED AND DID HARM"
match    = []   # prompt-level, not a serve flag — nothing to grep for
evidence = "runs/laguna-bound (3x, 2026-07-27): no reduction in empties, and on Q5 it ran ZERO qmd queries across all three repeats — falling back to bare grep, the anti-pattern APPEND_SYSTEM forbids — with grounding down ~40%. Two general lessons: the empties are READ-dominated (27-28 file reads against 17-20 bash calls), so a bound phrased against *searching* misses the actual context filler; and a self-counted budget asks the model for arithmetic over a transcript it cannot observe. Bound the loop mechanically or not at all."
