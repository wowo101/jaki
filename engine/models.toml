# ─────────────────────────────────────────────────────────────────────────────────────
# THE WEIGHTS. One row per file in the box's GGUF store, and the only home for a byte size
# or a digest. `engine/infra/model-store/download-candidates.sh` renders its manifest from
# these rows at every boot and holds nothing of its own; until 2026-09-10 it carried its own
# copy of every size, which is the duplication this table ends.
#
# TWO STATES, and the difference is what a cold rebuild pulls over the WAN:
#
#   serving   the deployed configuration loads it. This set IS the omni-modal package's
#             weights – a machine that has these ten files and the configuration in this
#             repo serves text, the delegate, images and vision. Fetched if missing.
#   archived  on the box and nothing loads it. NEVER fetched. Retired models keep their
#             weights (2026-09-08) so a re-test costs no download, but a fresh box
#             must not spend 400 GB of metered uplink acquiring them, and deleting one here
#             must stay deleted – the 2026-08-06 re-pull was an active row for a model that
#             had been pruned two days earlier.
#
# A ROW IS THE STORE'S DESIRED STATE, so removing a file means changing its state here, not
# just deleting it. A file in the store with no row is undeclared and nothing checks it.
#
# `for` names the registry key the file belongs to – `[models.<key>]` here, or `[retired.<key>]` /
# `[assessed.<key>]` in engine/models.archive.toml – which is where the verdict and the
# measurements live. Only `serving` rows are here; the archived rows are in that file, and
# `registry-query.py` appends them when it sits beside this one. The rows carry
# only what the fetcher needs plus the choices a reader would otherwise re-litigate.
#
# `sha256` is the file's LFS oid on Hugging Face, recorded where it is known. Only
# flux-ae.safetensors is CHECKED after a pull, and its row says why.
# ─────────────────────────────────────────────────────────────────────────────────────

