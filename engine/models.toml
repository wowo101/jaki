[models.zimage]
role     = "image"
gguf     = "z_image_turbo-Q8_0.gguf"
swap_id  = "zimage"                        # its llama-swap model id
size_gb  = 11.2
purpose  = "Local image generation: illustration, concept imagery, essay material. NOT diagrams or infographics – those are code-rendered (Mermaid or hand-authored SVG). Rides llama-swap as a guarded ttl'd entry for the single gesture; a batch takes the gpu-lease and stands its own sd-server, like any eval. THIS MODEL HOLDS THE SLOT AND IS PREFERRED FOR REALISTIC IMAGES (decided 2026-09-23). Qwen-Image-2.1 was measured against it and kept for two narrow jobs only – artistic photographs, and text in an image – at about 13x the wall time, non-commercially licensed, and capped at 768x1024 on this box. It has no router entry and is run under a lease: [assessed.qwenimage21] in engine/models.archive.toml."
weights  = "Three files, summed by the guard: the Q8_0 diffusion model (6,577,440,704 B, leejet/Z-Image-Turbo-GGUF – the sd.cpp author's own conversion) + the Qwen3-4B-Instruct-2507 Q8_0 text encoder (4,280,405,600 B – the EXACT model Z-Image conditions on; the store's Qwen3.5-4B cannot substitute) + FLUX's VAE as flux-ae.safetensors (335,304,388 B, sha256 afc8e282… – pulled from an ungated mirror, black-forest-labs is gated and 401s)."
evidence = "Backend A/B on the box 2026-08-22 (evaluations/models/zimage-backend-ab.sh, ab-20260822-100014): same prompt, seed 42, 768x1024, 8 steps, three runs per backend, every PNG pixel-asserted (stddev ~47, ~90k distinct colours – the grey-PNG VAE-OOM failure of sd.cpp #1220 never appeared). ROCm (7.14 toolbox) 29.3 s/image, Vulkan (host binary) 30.9 s – both stable, outputs byte-identical across runs within a backend at fixed seed, NOT across backends. VULKAN PINNED on operational shape, not speed: a host binary with bundled libs under the guard (no container, no cmdStop, no tenancy in the ds4 toolbox; since 2026-09-28 behind hatch-image-front, which signals it on stop), and 1.6 s/image does not buy that complexity back. Served round trip verified through llama-swap: 45.3 s cold including load, image pixel-asserted."
measured = { gen_s_768x1024 = 30.9, sampling_s_8_steps = 27.8, vae_decode_s = 2.1, served_cold_s = 45.3, gtt_gib_loaded = 10.2 }

note     = """THE SANCTIONED MEMORY CONFIGURATIONS LIVE HERE, canonically (every other file points at this key). THERE IS ONE, and everything the box serves is in it: qnext on gufo + the 4B delegate + this, all three standing behind llama-swap with no swap between them.

A NUMBER IS MEANINGLESS WITHOUT ITS STATE. Against a 124 GiB GTT, qnext on gufo in production shape:

  state                                        GTT     MemAvailable   when
  qnext alone, 2 sessions, 131k window        89.2    31.4           2026-10-05, gufo 0.7.0
  qnext + the 4B delegate                      89.3    -              the standing pair, before any image (2026-09-27)
  + zimage, loaded and idle                    98.7    16.7           after one image, during a busy maxload round (2026-09-28)
  PEAK, one 1024x1024 image, 4B loaded         106     18.5           2026-09-27, gufo b722a61
  PEAK, every model busy at once               114.6   1.1 (lowest)   maxload 2026-10-05, 0.7.0, 2 sessions at ~118k each, 131k window, 4 GiB RAM cache

sd-server loads its weights on the FIRST REQUEST and not at start, so zimage adds ~10 GiB only once an image has been asked for, and ~17 GiB at the peak of a cold image. Under gufo every byte is a fixed allocation: the n-gram table is read from disk and holds no page cache, so nothing gives way before the kernel's OOM choice. The production image path pauses the 4B for each image (~5 GiB), the front refuses an image whose need MemAvailable cannot cover, and the pressure watcher unloads an idle zimage below 8 GiB – engine/infra/model-serving/README.md, *The admission guard*. The llama.cpp serve's table, where -lm mmap made the table reclaimable page cache: [retired.qnext_llamacpp] in engine/models.archive.toml.

The three middle rows date from the 65k window, which ran 3.3 GiB lighter at load. CAVEATS THAT STILL BOUND IT: maxload ran with the speech container and GPU diarisation idle, and with the 4B left loaded through an image sent straight to sd-server, which production pauses and admits only with 11.5-17 GiB plus a 4 GiB floor free, so the 1.1 GiB low point is beyond what production allows; a run with diarisation active would size the margins.

Serving quirks are comments on the llama-swap entry, where an operator editing it is actually looking; Turbo wants cfg-scale 1.0 and no negative prompt."""
changes  = "Ask for a picture and one arrives in about half a minute, or 45 seconds if the model has to load first. It costs about ten gigabytes while loaded, sits alongside the resident and the delegate rather than displacing either, and unloads itself after 15 minutes idle. Asking for an image no longer costs you the chat model – that was the arrangement under the old escalation model, and it is gone."

  [models.zimage.serve]
  binary   = "~/.local/share/image-gen/sd-cpp/97d2990/vulkan/sd-server (host binary, all libs bundled)"
  flags    = ["--diffusion-fa", "--cfg-scale 1.0", "--steps 8"]
  weights  = ["--diffusion-model z_image_turbo-Q8_0.gguf", "--llm Qwen3-4B-Instruct-2507-Q8_0.gguf", "--vae flux-ae.safetensors"]
  note     = "ADDED 2026-09-09 because its absence was silence, not coverage: models-check.py compares each standing model's running flags against `serve` BY THAT KEY, so an entry without one produced no line and no finding while reading as a clean run. Turbo wants cfg-scale 1.0 and no negative prompt. sd-server spells the bind `--listen-port`, not `--port`, and serves no /health (404, verified 2026-08-22) – hence `checkEndpoint: /` on the llama-swap entry, without which the readiness probe never turns green and every request queues into healthCheckTimeout."

[models.speech]
role     = "speech"
swap_id  = "speech"                        # its llama-swap entry; callers name a model id below
size_gb  = 2.0                             # weights, measured on HF 2026-09-10: whisper turbo 1.62 + Kokoro 0.35 + Piper 0.06. RESIDENT COST IS NOT THAT: the container idles at ~60 MB RSS and reaches ~2.5 GiB while whisper is loaded, releasing it 300 s after the last transcription.
purpose  = "Speech in and speech out for the whole tailnet: Open WebUI's microphone and read-aloud, and any client that posts to /v1/audio/transcriptions or /v1/audio/speech. CPU only – it holds no GPU and takes no lease."
server   = "speaches 0.8.3 (MIT), ghcr.io/speaches-ai/speaches:0.8.3-cpu, image digest sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8. Three executors behind the OpenAI audio endpoints: faster-whisper in, Kokoro and Piper out. PINNED TO THE RELEASE, NOT latest-cpu: 0.9.0 is in release-candidate upstream and renames the configuration this entry sets – stt_model_ttl and tts_model_ttl replace WHISPER__TTL, and preload_models arrives. Bump deliberately and re-read the WHISPER__* names against the new config.py when you do."

# THE ROUTABLE IDS, as a list because models-check.py reads it: it asks the running server
# which models it holds and compares against exactly these. Prose alone would not be checked.
# They are the UPSTREAM's own names, not short ids of ours. llama-swap starts one process per
# model id, so three short ids would mean three containers; aliasing one entry with the names
# speaches itself uses keeps it to one container and forwards the request body unrewritten,
# which means a caller names the model it actually gets.
model_ids = [
  "deepdml/faster-whisper-large-v3-turbo-ct2",
  "speaches-ai/Kokoro-82M-v1.0-ONNX",
  "speaches-ai/piper-de_DE-thorsten-medium",
]
models   = """WHAT EACH ONE IS.
  · deepdml/faster-whisper-large-v3-turbo-ct2 – speech in. Multilingual (de and en among the nine languages its card tags), CTranslate2, served int8 on CPU. THE SAME MODEL A LOCAL TRANSCRIPTION TOOL RUNS (`large-v3-turbo`), so the box holds one ASR weight set and one behaviour to know.
  · speaches-ai/Kokoro-82M-v1.0-ONNX – speech out, English. Open WebUI's TTS points here (2026-09-10), voice af_heart.
  · speaches-ai/piper-de_DE-thorsten-medium – speech out, German. Kokoro's languages are en/es/fr/hi/it/ja/pt/zh and German is not among them; Piper ships one repo per voice, so a second German voice would be a second id.
`whisper-1` IS NOT ROUTED. It is speaches' own alias for Systran/faster-whisper-large-v3, a second ASR weight set this box does not hold, and a 404 from the router beats fetching 1.5 GB nobody asked for. Its TTS twins `tts-1` and `tts-1-hd` ARE routed as aliases on the llama-swap entry, because speaches maps them to the Kokoro model already served and Open WebUI's AUDIO_TTS_MODEL defaults to `tts-1` – a default already written into its database, so read-aloud posts it until someone opens Admin Settings → Audio."""
evidence = "DEPLOYED AND VERIFIED 2026-09-10: round trip through the router in both languages – Kokoro speaks \"The tide turns at four.\" and whisper returns it verbatim; Piper speaks \"Die Tide kentert um vier Uhr.\" and whisper returns \"Die Tide kentert um 4 Uhr.\" (its own numeral normalisation). 3.7 s cold on a 1.3 s utterance, 2.7 s warm. GTT 0.5 GiB with speech up and no model server running, so the CPU-only claim is measured and not asserted; the resident loaded beside it in 24.6 s to 70.2 GiB. `tts-1` routes, which is what Open WebUI posts by default. Chosen over Open WebUI's bundled faster-whisper because that one serves the browser alone: an agent harness, a transcription tool and any other tailnet client would have no speech address. llama-swap v246 – the build already on the box – routes /v1/audio/speech, /v1/audio/voices and the multipart /v1/audio/transcriptions, and applies its alias resolution to the form field as well as to a JSON body, so the audio tier needed no router upgrade. Read off v246's own internal/server/server.go and internal/server/filters.go."
note     = """NO GUARD, ON PURPOSE. hatch-serving-guard refuses a load whenever an eval or a `--resident stop` lease owns the GPU. This server never competes for the GPU, so wrapping it would close speech for the length of every battery in exchange for nothing. WHISPER__INFERENCE_DEVICE=cpu makes CPU-only structural rather than a claim – `auto` is upstream's default and would look for an accelerator.
IT IS A MEMBER OF THE `box` GROUP AND THAT IS NOT A MEMORY CLAIM. A llama-swap entry named in no group lands in `(default)`, which is created with `exclusive: true`, so loading it would unload the resident. Membership is what stops a dictation evicting 87 GiB.
NOT IN engine/lib/gpu-binaries.env, for the same reason zimage is not: that file answers who is holding the GPU, and this holds none. A `--resident stop` lease stops the container along with the router's models; it returns on the next speech request.
HF_HUB_OFFLINE=1 ON THE SERVING CONTAINER. Weights arrive only through engine/infra/model-serving/speaches-models.sh, so a chat message can never start a multi-GB pull over a slow uplink; a missing model fails the request instead. That script asks speaches to download (POST /v1/models/<id>) rather than fetching files itself, because which files a model needs is the executor's knowledge and a copy of it here would go stale.
WHISPER__CPU_THREADS=8 of 32. Upstream's default is 0, meaning all of them, which puts a transcription in the middle of whatever the resident is decoding."""
changes  = "You can talk to the box and it can talk back. The microphone button in the browser transcribes what you said, in German or English, and the read-aloud button speaks the answer in an English voice. Both run on the processor, so neither takes anything away from the model that is answering you, and neither waits when an evaluation has the GPU."

  [models.speech.serve]
  binary   = "podman run ghcr.io/speaches-ai/speaches:0.8.3-cpu – the CPU image, no toolbox and no host binary"
  # env, not flags: the podman command line is how these are set, but the container's own
  # environment is what decides behaviour, and it is what models-check.py reads back from
  # `podman inspect`. A flag list would be checked against the argv that produced it, which
  # is one step short of the artefact.
  env      = [
    "ENABLE_UI=false",
    "WHISPER__INFERENCE_DEVICE=cpu",
    "WHISPER__COMPUTE_TYPE=int8",
    "WHISPER__CPU_THREADS=8",
    "HF_HUB_OFFLINE=1",
  ]
  container = "speaches"
  note     = "WHISPER__TTL is speaches' own idle unload and is left at its 300 s default: the container stands (llama-swap `ttl: 0`) so the address always answers, while the ~1.6 GiB whisper model comes and goes underneath it. Health is `/health`, which llama-swap's default checkEndpoint already uses – unlike sd-server, this one serves it. `/v1/audio/voices` exists on both sides – llama-swap dispatches it as a GET with the model in the query string, and speaches answers it – but Open WebUI calls it with NO model parameter, so that call fails through the router and its voice dropdown falls back to OpenAI's own names, which speaches rejects. Type the voice rather than picking it."

# ─────────────────────────────────────────────────────────────────────────────────────
# THE BINARIES. The three upstream releases this repo does not carry and cannot build: the
# serving engine, the router in front of it, and the image server. `serving-binaries.sh`
# fetches them, checks the digest and unpacks them where `llama-swap.yaml` and
# `llama-swap.service` expect to find them.
#
# THE VERSION LIVES HERE AND NOWHERE ELSE. `hatch install` emits `HATCH_BIN_<NAME>` from each
# row's `dest` + `verify`, and `llama-swap.yaml` names that variable, so a bump is one edit and
# a re-run of the fetcher. `verify` is what makes a bump complete rather than started, because
# an archive that unpacked to the wrong shape leaves the old binary in place and the router
# keeps working until the next restart; the pin is stamped beside the binary and compared.
#
# `sha256` IS CHECKED ON EVERY FETCH, unlike the weights, where re-reading 100 GiB at each
# boot would cost minutes for files nothing can have changed. These are tens of megabytes and
# they are executables.
# ─────────────────────────────────────────────────────────────────────────────────────

[[binaries]]
name    = "llama-server"
what    = "the serving engine: llama.cpp on the Nathan lineage, with its own bundled RADV"
url     = "https://github.com/Nathanw1014/strix-halo-llamacpp/releases/download/v0.7.6.1/strix-halo-llamacpp-vulkan-portable.tar.gz"
sha256  = "b75fc46bb30c52f6b2e905c9f959cba3aa2c253fa148e667f243ef4744bb8658"
bytes   = 34938792
unpack  = "tar"
dest    = "~/.local/share/box-model-eval/nathan-fork/v0.7.6.1"
verify  = "vulkan/llama-server"
note    = "THE `vulkan/` IS PART OF THE PATH. v0.6.1 unpacked that directory's contents at the top level and every release since keeps the directory, so a path copied from that era resolves to nothing – and llama-swap reports any early exit as `upstream command exited prematurely`, which reads like a bad flag. The pin and the evidence behind it are [models.qnext.serve].engine; any bump is gated on evaluations/models/apepojken-plain-control.sh reading 9/9 on the new binary."

[[binaries]]
name    = "llama-swap"
what    = "the router: one OpenAI-compatible address in front of every entry"
url     = "https://github.com/mostlygeek/llama-swap/releases/download/v246/llama-swap_246_linux_amd64.tar.gz"
sha256  = "92ea5c37f66a7ed31bd83ffb1b1b46b7f033881f742fead6c6e64a6601013352"
bytes   = 12878901
unpack  = "tar"
only    = "llama-swap"
dest    = "~/.local/bin"
verify  = "llama-swap"
note    = "v246 already routes /v1/audio/speech, /v1/audio/voices and the multipart /v1/audio/transcriptions, and resolves `${env.…}` macros in its config, which is what lets llama-swap.yaml carry no machine's paths. `only` because this archive also holds a README and a licence, and ~/.local/bin is a PATH directory. The digest matches the release's own llama-swap_246_checksums.txt, read separately."

[[binaries]]
name    = "sd-server"
what    = "the image server: stable-diffusion.cpp, Vulkan build, all libraries bundled"
url     = "https://github.com/leejet/stable-diffusion.cpp/releases/download/master-827-97d2990/sd-master-97d2990-bin-Linux-Ubuntu-24.04-x86_64-vulkan.zip"
sha256  = "448c2b00882dffe14cc976223c9057ff16ebe5dd0d47f862ea574c3feff37d72"
bytes   = 46006487
unpack  = "zip"
dest    = "~/.local/share/image-gen/sd-cpp/97d2990/vulkan"
verify  = "sd-server"
note    = "Vulkan rather than the ROCm build, on operational shape and not on speed: a host binary with bundled libraries runs under the guard with no container and no cmdStop (since 2026-09-28 behind hatch-image-front, which signals it on stop), and 1.6 s/image does not buy that complexity back. The A/B is [models.zimage].evidence. leejet publishes one release per master build, so the tag carries the commit and the pin is exact."

# ─────────────────────────────────────────────────────────────────────────────────────
# THE CONTAINER IMAGES a GPU entry runs from, pinned by digest. `serving-binaries` pulls each
# one by `ref@digest` and checks the digest podman reports; `hatch install` emits
# `HATCH_IMG_<NAME>` as `ref@digest`, which is what llama-swap.yaml names – never a tag, since
# the upstream rebuilds its tags. A bump changes `digest` and `version` here, then
# `serving-binaries`, `hatch install` and a router restart. `version` is what
# `gufo --version` prints from the pulled image, and is checked.
# ─────────────────────────────────────────────────────────────────────────────────────

