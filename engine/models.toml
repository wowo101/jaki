# The serving portfolio — canonical, with provenance.
#
# WHAT THIS IS. One place that says which local models hatch runs, in what role, with
# which serving and sampling configuration, and **on what evidence**. It is the first
# concrete artefact of the router described in `evaluations/agent/model-router-assessment.md`
# ("build the static job→config table first"), and the pinned output of the `box-model-eval`
# agent-axis evaluation.
#
# WHY IT EXISTS. The router assessment's finding is that "which model" is the small part and
# the smeared, undocumented **config** is the real problem. That is not a forecast — on
# 2026-07-27 a single session found four independent instances of it:
#   · Laguna served with YaRN geometry built for a 1M window while never exceeding 65k —
#     wrong for roughly a month, invisible because nothing declared what "right" was.
#   · The 35B's Pi compaction threshold computing to exactly 0, so it compacted after every turn.
#   · `--cache-reuse 256` copied into five serve lines and dead in all of them.
#   · The 122B battery run at the model card's *precise-coding* temperature instead of its
#     general-task one, which cost it three gold landmarks and nearly cost it the evaluation.
# And the repo's own canonical serving artefact had diverged from the running unit in model,
# geometry, binding and runtime. (What launches a model today is
# `engine/infra/model-serving/llama-swap.yaml`, provisioned rather than hand-copied.)
#
# THE `evidence` FIELD IS LOAD-BEARING, not decoration. Every value here was expensive to
# establish, and a registry that records only *what* rots exactly the way the service file did.
# Recording *why* makes it auditable: a future reader can tell a hard-won setting from a
# copied-in default, and can re-check the claim. Do not add a setting without one.
#
# THE `changes` FIELD ANSWERS A DIFFERENT QUESTION: what a human would NOTICE if this profile
# were the one running. `evidence` justifies the setting to someone auditing it; `changes`
# describes the profile to someone deciding whether they want it, in words that carry no flag
# names. It exists because the agent surface is meant to be able to *propose* a profile change
# and have a person accept or reject it, and a proposal is only
# answerable if the offer says what changes rather than which knob moves. Write it in terms of
# the answer he gets — speed, depth, whether it holds together, what it costs — and state the
# failure mode, not only the benefit. Every profile gets one.
#
# `role` IS WHAT THE BOX SERVES TODAY, not what has been decided. `engine/models-check.py`
# compares the router's loaded models against `models.qnext.serve` and `models.qwen4b.serve`
# BY THOSE KEY NAMES, so a decided-but-undeployed portfolio change does NOT move keys here – it
# goes in a `[pending.*]` block, and the keys move in the commit that deploys it. A `[pending.*]`
# block present means some `role` value below is not the intended one; read it first.
#
# WHAT IS NOT HERE: models that served and were retired, candidates assessed and not adopted,
# and the weight files the box keeps without fetching. They are in `engine/models.archive.toml`,
# same shape, which a jaki checkout does not carry; this file holds only what a fresh machine needs.
#
# WHAT READS IT: `engine/models-check.py` verifies the box against it. The serving profiles are
# COPIED into `engine/infra/model-serving/llama-swap.yaml`, which is what launches them; this file is
# canonical and that one is the copy, so a change here is a change there.

schema = 1
host = "strix-halo"                        # the reference machine; every number here was measured on it
store = "~/.local/share/models/gguf"
ceiling_gib = 102                          # practical model+KV ceiling (124 GB GTT − overhead)

# ─────────────────────────────────────────────────────────────────────────────────────
# THE PORTFOLIO (roles decided 2026-07-27; last revised 2026-09-08, the sole-resident call)
# Three roles, all three standing at once behind one address, `llama-swap` on :9090:
#   resident  ← everything interactive: chat, recall, drafting, reading an image
#   delegate  ← the mechanical work: tagging passes and transcript cleanup batches
#   image     ← local image generation, co-resident with both
#
# `co-resident` and `escalate` ARE GONE, and their absence is a decision rather than an
# oversight. qnext took the deep-drafting axis ds4's rung had been narrowed to, so a
# human-gated move UP has nothing left to move up to.
# `evaluations/agent/delegate-escalate-design.md` describes a two-direction router; only the
# delegate direction survives.
#
# WHERE THE TIER IS DECLARED, and this file is not it: `engine/lib/gpu-binaries.env`, read by
# `gpu-lease`, `hatch-serving-guard` and the taskboard, so a model added to the tier is known to
# all three at once. Two keys, because a standing model can hold the GPU in either of two
# shapes – HATCH_RESIDENTS (`unit:port:gguf:container`) for a systemd unit, and
# HATCH_ROUTER_RESIDENTS (llama-swap model ids) for one the router holds. Every model below is
# in the second shape today. A model with a role here and a name in neither key there makes
# every `gpu-lease acquire` refuse and puts the model on the taskboard as an unleased GPU
# holder. `test-gpu-lease.sh 23` asserts each consumer acts on that file.
# ─────────────────────────────────────────────────────────────────────────────────────

[models.qnext]
role     = "resident"
gguf     = "Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf"   # 4-shard split
swap_id  = "qnext"                         # its llama-swap model id; how the tier names it
size_gb  = 111.3
params   = "125B total / 6B active MoE (10-of-512 routed, expert_ffn_len 640, 48 blocks: 36 Gated DeltaNet + 12 Qwen Sparse Attention) plus a 51B n-gram embedding table"
purpose  = "Everything interactive: chat, recall, drafting, and reading images. The box's only large model, and the only one Open WebUI lists."
adopted  = """SOLE RESIDENT at reasoning_effort low, SERVED ON GUFO SINCE 2026-09-28: unsloth/Qwen3.8-Flash-Next-GGUF UD-Q4_K_XL (4 shards) + Unsloth's shared MTP Q8_0 head + Unsloth mmproj BF16, in the gufo runtime image pinned in [[images]]. ADOPTED 2026-09-08 on two sealed blind reads and served on llama.cpp until the switch, decided 2026-09-27 on a two-session trial (evaluations/models/reports/gufo/README.md). The llama.cpp serve and its measurements: [retired.qnext_llamacpp] in engine/models.archive.toml."""
evidence = """Two sealed blind reads, both opened 2026-09-08 after the verdicts were committed at a834385. DRAFTING: ranking P02 > P06 > P03 > P05 > P04 > P01 resolves to N D N N D D – qnext first, its worst passage above ds4's worst two, mean rank 2.67 vs 4.33. ds4 held the escalation rung on drafting alone (recall moved to the 27B on 2026-08-17), so losing it leaves that rung with nothing to escalate to. RUNG: four pairs indistinguishable on the read, so the marker count decides – low scores 16/18 against medium's 14/18 at 24% less wall. The n=1 ladder read preferring medium does not survive n=4. Reports: evaluations/models/reports/qnext-vs-ds4/prose/ and reports/qnext-rung/, each with VERDICT.md; assessment hub reports/qnext/README.md. SPEED on gufo 0.1.1, 2026-09-28, served with the MTP head, n=5 a cell: decode 35.3 tok/s at ~2k, 37.6 at ~13k, 37.4 at ~29k, 33.3 at ~59k, acceptance 0.58-0.67; prefill 1,100-1,220 tok/s at every depth. Against the llama.cpp pin on one evening (2026-09-27): prefill 2.0x, MTP decode +7% at ~2k and +24-38% from ~13k to ~59k, the six-query recall battery 19 min against 28. The llama.cpp speed history: [retired.qnext_llamacpp].speed."""
regression_cleared = """The retired 27B tier existed largely because the 35B FAILS the Librela known-answer query (answers 2026-05-18 against gold 2026-07-11, reading top-BM25-relevance as most-recent). qnext concludes 2026-07-11 in 9 of 9 runs across qnext-low, qnext-battery and qnext-norare, separates ordering from administering a dose, and surfaces the still-unchecked 2026-08-26 order that no other arm mentions. VERIFIED BY READING THE ANSWERS: both dates appear in every arm's text, so a grep count for the gold date is not the test and would have passed the 35B too."""
costs    = """THREE accepted. (1) Everyday decode is ~35 tok/s at chat depth against the 35B's 58, held to ~59k (33 there); prefill is ~1,200 tok/s at every depth. (2) THE GERMAN DEFECT below; on gufo at effort low one of five German answers carried a CJK word (2026-09-27). (3) HEADROOM: gufo's memory is fixed allocation – 84 GiB resident, no page cache to give way first – so with every model loaded and busy at once the box peaked at 110.1 GiB with 4.4 GiB available on 0.1.1, below 8 GiB for 8 s (maxload, 2026-09-28, the 4B left loaded through the image). The delegate's pause per image, image admission and the pressure watcher are the mitigation: engine/infra/model-serving/README.md, *The admission guard*."""
german_defect = """qnext SUBSTITUTES A CHINESE TOKEN FOR A GERMAN CONTENT WORD in 8 of 15 German answers, leaving German morphology around it: `weder 连接et ist` for verbunden, `unserer 语言 greifen` for Sprache, plus 伦理, 命题, 同一 意图, 系统 而非 最近, 每个, 的标准 艺术. A blind read of the same query independently called the German wooden and grammatically wrong on both arms. SCOPE, counted across every answer in evaluations/agent/runs/: qnext German 8/15, qnext English 0/66, EVERY OTHER PORTFOLIO MODEL German 0/78 (35B 0/12, 27B 0/6, ds4 0/9, Laguna 0/14, 122B 0/6). Fires on the apepojken fork too, on a different engine, so it is the model and not the build. ACCEPTED 2026-09-08 as a cost of the pin. THE GOLD-SET SCORER CANNOT SEE IT – it counts marker recurrence, so an answer scores 3/3 while carrying Chinese tokens, which is how this survived an 18-run battery, a flag sweep and an effort ladder. evaluations/agent/README.md MANDATORY PRE-FLIGHT now instructs a scoring session to read one full German answer and count CJK codepoints per candidate; turning that into a scorer assertion is open and unowned."""
structural = """CANNOT CO-RESIDE WITH ANOTHER LARGE MODEL, which is why the role is sole-resident-or-nothing: 84 GiB resident on gufo of a 124 GiB GTT. No rung changes that much – the engram table is IQ4_NL 26.82 GiB byte-identical in every rung, and gufo reads it from disk rather than holding it. THE BLIND DRAFTING READ SETTLED THE ROLE: qnext took ds4's own axis, which left the swap-in slot with nothing to swap in for. The 4B delegate is KEPT (2026-09-08) for mechanical work – qnext subsumes its vision job, not its throughput job. Small models fit beside it, measured on gufo 2026-09-27: the 4B at ~5 GiB, and zimage at ~11 GiB with a 17 GiB peak for a cold image."""
changes  = "The one model the box has, and it answers everything: a quick question, a search over your notes, a piece of drafting, and it can look at an image without handing off. A chat answer arrives at roughly 35 tokens a second, against 58 for the model it replaced, and it keeps that pace as a conversation gets long. It reads a long prompt about twice as fast as it did before the 2026-09-28 engine switch, so a search over your notes finishes about a third sooner. It is the whole box, so no second large model runs beside it, and when the box is at its fullest an image request can be turned away with a message to try again. It writes bad German: expect wooden phrasing, grammatical errors, and now and then a Chinese word where a German one belongs."

  [models.qnext.serve]
  engine   = "gufo 0.7.0 (aedc129) – C++/HIP for gfx1151 on ROCm 7.2.3, run from the gufo-runtime podman image pinned by digest in [[images]]. SERVES SINCE 2026-10-04, on gufo since 2026-09-28. GATES ON THAT DIGEST, 2026-10-04, evaluations/models/gufo-trial.sh, outputs in ~/.local/share/box-model-eval/gufo-070-*/: the plain control 9/9; vision 6/6 gold labels; chat cache PASS replayed both with and without reasoning_content; the MTP ladder at 2 sessions and a 4 GiB RAM cache, n=5 a cell, prefill 1,089-1,221 tok/s and decode 33-40 tok/s to ~59k; maxload PASS at 2 sessions, peak 107.5 GiB, lowest MemAvailable 5.1, 3.0 GiB swap used. The 0.1.1 digest stays on the box as the rollback. WHY GUFO: prefill 2.0x the llama.cpp pin and MTP decode +7% to +38% by depth, same box and evening, and open source (MIT). UPSTREAM PACE: two maintainers, a release line since 0.1.0 on 2026-09-28 and an image rebuilt daily; move by digest and deliberately, and stack-watch reports each release. OPEN RISKS: #278 serves a lost GPU context as HTTP 200 with an empty body while /ready stays green, so a check asserts on content; #266 ends a tool call inside reasoning when max_tokens runs out."
  flags    = ["--context 131072", "--sessions 2", "--cache-ram-bytes 4294967296", "--max-pending-per-client 16", "--max-connections 24", "--cache-disk /cache", "--cache-disk-staging-bytes 8589934592"]
  admission = "THE ROUTER ADMITS 18 IN FLIGHT AND GUFO TAKES 24 CONNECTIONS (2026-10-05). llama-swap v246 lets 10 requests be in flight per model by default and answers 429 past it (a throwaway v246 router: 14 at once, 10 x 200 and 4 x 429), so gufo's 2 sessions plus 16 queued were never reached; concurrencyLimit 18 on the router entry meets them. gufo answers 503 past --max-connections, default 16, so it is raised to 24 for the 18 requests plus the router's readiness polls and idle keep-alive connections. gufo keys its per-client queue by the socket peer, which is always the router, so the queue is first come, first served across every caller (src/cli/serve/http_server.cpp, v0.7.0); the router does send X-Forwarded-For."
  draft    = ["--speculative mtp", "--mtp-model mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf"]
  sampling = { temp = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repeat_penalty = 1.0 }
  # What hatch-serving-guard sizes a container entry by, in GiB: its weight paths are container
  # paths, and gufo holds less than its files weigh. GTT in production shape (MTP head and
  # projector loaded, 2 sessions) read 89.2 at --context 131072 on gufo 0.7.0 on 2026-10-05
  # (85.9 at 65536 on 2026-10-04, where each session past the first added ~1.85 GiB).
  resident_gib = 90
  # A KEY, not a sentence, because models-check.py reads it (off the running --reasoning-effort
  # flag). Values: xhigh | medium | low.
  reasoning_effort = "low"
  effort   = "reasoning_effort = low, PINNED, and set SERVER-SIDE with gufo's --reasoning-effort. Adopted 2026-09-08 on the sealed rung packet: all four pairs read indistinguishable, so the marker count decided – 16/18 against medium's 14/18, at 24% less wall. The knob reads low, medium and xhigh, and a request may set it per call (2026-10-05, engine/infra/model-serving/client-contract-probe.py); minimal reads as low, high and max as xhigh, none as no effort sentence. Pi sends one whenever its model entry says reasoning: true – medium unless defaultThinkingLevel says otherwise. Thinking-off is a different switch. It is prompt injection in the chat template: low prepends a sentence, medium prepends nothing."
  note     = "THE DRAFT HEAD IS UNSLOTH'S SHARED Q8_0, the one gufo's adaptive drafter is measured against; the archived mtp-Qwen-Qwen3.8-Flash-Next-Q8_0.gguf in the store is a different head. `--cache-disk-staging-bytes` 8 GiB because the default – the smallest of 1 GiB, RAM/8 and the disk budget – skips the 1.4-1.5 GB snapshots a 40-60k conversation produces (gufo #259, #279). gufo's /health is liveness only, so the router waits on /ready. Load: ready in 25-30 s when its weights are in page cache and 65-95 s otherwise (gufo 0.1.1, 2026-09-28; the router's 19:45 start logged 66 s, 45 s of it fingerprinting the weights)."
  cache    = "A CHAT REUSES ITS WHOLE HISTORY FROM CACHE on 0.7.0, whether the client replays earlier answers with their reasoning_content (Pi) or without (a plain chat client): evaluations/models/chat-cache-probe.py, five turns on a ~4.9k-token first message, PASS both ways on 2026-10-04 (lowest reuse 4,917 of 4,922 tokens replayed without reasoning). 0.1.1 reused only the first message when reasoning was not replayed, which is why open-webui.service marks its connection as a llama.cpp provider; that setting stays and costs nothing. Sibling requests that share a prefix – sub-agents with one system prompt – read it from cache: the concurrency probe's later children read 2,048-3,358 tokens from cache."
  sessions = """TWO SESSIONS, so two requests decode at once – parallel research sub-agents, or a chat beside an agent (WORK/research-agents.md). Measured 2026-10-04 on 0.7.0 with evaluations/models/gufo-concurrency-probe.py, four children sharing a ~3.3k-token system prompt, each with its own ~10k-token task: 78.5 s at 1 session, 68.7 s at 2 (-12%), 62.8 s at 4 (-20%). The gain is small because gufo prefills one request at a time and these children are mostly prefill; while two decode at once each runs at ~26 tok/s against ~38 alone. Siblings read the shared system prompt from cache. FOUR SESSIONS FAIL MAXLOAD: peak 114.7 GiB, 12.6 GiB swapped, the OOM killer took gufo. --cache-ram-bytes IS SET because the automatic budget is half of free RAM at start, up to 32 GiB, and it grew MemAvailable down from 34 to 18 GiB over one ladder (gufo #387). --max-pending-per-client 16 because every consumer on this box reaches gufo from loopback, which gufo counts as one client and refuses past 4 queued requests with HTTP 429. Changing --sessions invalidates the disk cache. THE WINDOW IS 131,072 SINCE 2026-10-05, at two sessions and the 4 GiB RAM cache: maxload PASS three times (gufo-trial.sh CONTEXT=131072 SESSIONS=2, outputs in ~/.local/share/box-model-eval/gufo-131k-20261005{,b,c}/), one ~118k-token request on each session beside the 4B, a qmd search and an image: peak GTT 110.8-114.6 GiB, lowest MemAvailable 1.1-1.7 GiB (below 3 GiB for 26 s in the first), 3.2-3.9 GiB swap, no kill. Only the third run's decode round met decode with its image, as its own check confirms (both sessions decoding from 104 s before the image to 60 s after); decode under the image ran ~20 tok/s. Production cannot reach that low point the same way: maxload sends its image straight to sd-server, while the image front pauses the 4B and admits an image only with 11.5-17 GiB plus a 4 GiB floor free. One request at 117,790 tokens alone: prefill 1,145 tok/s, decode 37.7 tok/s; two at once under that load, prefill 718-919 and decode 25-26 each. A snapshot at ~118k is 3.35 GB, so one conversation that deep fills most of the RAM cache. A ladder at 1 session with an explicit 8 GiB cache, minutes after a cold boot, read single repeats as low as 550 tok/s prefill and 24 tok/s decode at ~2k, ~8k and ~29k; the 4 GiB and automatic runs that followed were steady, and the cause is not isolated."""
  gate     = "Speculation is asserted per request on timings.draft_n (flashnext_depth_probe.py --require-draft); gufo logs `speculative=mtp draft_limit=7` on its load_completed line. Every trial request asserts on the answer's content, never on the status alone, because of #278."

  [models.qnext.vision]
  mmproj   = "Qwen3.8-Flash-Next-mmproj-BF16.gguf"   # 907,542,944 bytes, Unsloth
  purpose  = "The resident reads images itself. This is what retired the vision delegate: the 4B's mmproj existed because ds4 had no eyes, and ds4 is gone."
  evidence = "6/6 gold labels off the vision-delegate bench chart on gufo 0.1.1 (2026-09-28) and on b722a61 (2026-09-27), an image prompt of ~2,300 tokens in 7.8 s, against the Qwen3.5-4B delegate's 5/6. gufo's /props reports no modalities, so the gate runs with EXTERNAL=1. Bench and labels: evaluations/models/vision-delegate-bench.py at tag archive/vision-delegate, and WORK/vision-delegate.md."
  note     = "Loaded on the resident's own serve line, so vision costs no second model and no second load. The vision-delegate seam is retired from the tree (2026-09-11): specs/vision-delegate.md describes it and tag archive/vision-delegate holds it, for a text-only resident that ever needs an image path."

  [models.qnext.pi]
  provider       = "local"
  context_window = 131072
  # Pi's per-reply output limit; Pi's default is 16384, which a long document written in one
  # reply with reasoning at medium used up on 2026-10-05, losing the draft. Pi clamps it to
  # the room left in the window.
  max_tokens     = 32768
  reasoning      = true      # Pi's per-model flag; `jaki client-config pi` copies it
  compaction     = { reserve_tokens = 16384, keep_recent_tokens = 20000 }   # Pi's defaults, set globally in Pi's settings
  evidence = "The reserve sets two things. Pi compacts once the context passes the window minus the reserve, and it gives the compaction summary 80% of the reserve as its token budget, reasoning included. A 3,072 reserve fails on qnext: near the window Pi caps each reply at the window minus its own estimate of the prompt, which reached 1 token at ~62k, and the emergency compaction's summary then ran out of its 2,457 tokens at medium thinking, so Pi kept no summary and the next request exceeded the window (WORK/research-agents.md, 2026-10-05). At 16,384 the summary has 13,107 tokens. The context window is the served --context, so it is honest."

[models.qwen4b]
role     = "delegate"
gguf     = "Qwen3.5-4B-UD-Q4_K_XL.gguf"
swap_id  = "qwen3.5-4b"                    # its llama-swap model id; how the tier names it
size_gb  = 3.0
purpose  = "The mechanical work, and since 2026-09-08 the model that actually does it: document tagging and transcript cleanup batches all resolve here."
ruling   = "THE SLOT AND THE DELEGATION PATTERN BOTH STAY (decided 2026-09-11), and this model holds the slot until a successor appears. Raised because a faster engine would narrow the resident's gap to this model from 4.4x prefill and 1.9x decode to roughly 1.4x and 1.3x, which retires SPEED as the reason to keep a second model. Three reasons survive that and none is measured: CONCURRENCY - a single-model box serving a tagging batch beside a chat turn shares one KV pool, and on halogen's published table two streams halve per-stream decode and the drafter stops speculating unless a stream is alone; THINKING COST - this model runs thinking fully off, which is what stops it spending its budget on reasoning_content and returning empty tags at finish_reason=length, and a reasoning resident would need an equivalent floor over a 400-document batch; TAGGING QUALITY ON THE RESIDENT, never run on the strip-and-reconstruct harness, on a slot that has already rejected two faster challengers for losing year, author recall and tag recall. AVAILABILITY argues the same way: one model means a stall takes chat, recall, tagging and image reading down together. The cells that would settle it are in WORK/halogen-eval.md."
consumers = """PROMOTED 2026-09-08 from a role this key described to one it holds. Until the sole-resident deployment those three consumers pointed at :8081 and therefore at the 35B, while this entry's `purpose` said tagging was the delegate's job and the strip-and-reconstruct harness scored the 4B – both true of different paths, and nothing said so. THE COST IS NAMED RATHER THAN DISCOVERED LATER: the 4B has never been scored against the 35B on tagging, only against Ling-3.0-tiny, so the change in tagging quality is real and unmeasured. Against Ling it holds 100% within the prompt's 2-5 tag limit (Ling 52%), in-pool 87% (78), year 86% (76), authors 0.92 (0.82)."""
evidence = "Tagging bake-off on the X1 (~2x prefill throughput vs the larger candidates); wiring-validation baseline for the box. See MEMORY.md 2026-07-08. Re-measured on Nathan v0.7.4.1 2026-09-05 and within 2 points of July on everything except year (86 vs 79%), so the greedy-repeatability fix did not move the baseline: prefill 1,805 tok/s, decode 55, 13.7 docs/min. HELD AGAINST TWO CHALLENGERS for this slot: Ling-3.0-tiny 2026-09-05 and MiniCPM5-2B 2026-09-09 (see [assessed.ling3_tiny] and [assessed.minicpm5_2b] in engine/models.archive.toml). Both are faster and both lose the metadata columns a literature note depends on. Two weaknesses the challengers exposed and this model still has: it ignores the prompt's rule-1 type tag, returning one on 1 of 28 documents where MiniCPM returns one on 29 of 29, and it TRANSLATES GERMAN TITLES into English or French where both challengers keep them in German. It also fabricates authors - Botvinick for a Huettemann chapter - reproducibly on a fresh server, so that is the model and not a cache artefact. Its 2026-09-09 re-measurement is byte-identical to 2026-09-05 on all 30 rows; its speed moved 3-4% between the two, which is the floor on reading any speed number here. RE-PIN A/B 2026-09-11, Nathan v0.7.5 build 10677, both files served side by side by delegate-serve.sh under a keep lease, strip_reconstruct.py on the same 30-document slice and the German six, greedy: the previous artefact reproduces its 2026-09-09 rows 30/30 byte for byte on the new engine, so the two files sit on one scale. Upstream's file against it: 18 of 30 documents differ in at least one field, and the aggregates move by about one document either way – year 23/28 vs 24/28, author recall 0.94 vs 0.92, tag recall 0.36 vs 0.35 and precision 0.53 vs 0.51, in-pool 86% vs 87%, title counts identical (21 exact, 2 close, 3 partial, 2 wrong), tag count within 2-5 on 100% for both. German six identical on every column except tag precision, 0.53 vs 0.58, from two more predicted tags. Speed inside the floor: 13.88 vs 13.71 docs/min, prefill 1,846 vs 1,808 tok/s, decode 54.3 vs 54.9. VERDICT: equivalent at this harness's resolution; the re-pin costs nothing measurable and buys a file a fresh machine can fetch. The deployed llama-swap entry loaded the new file and answered a thinking-off probe the same night. Run outputs are gitignored since 2026-09-11; the rows are on the laptop at evaluations/tagging/reports/strip-reconstruct-results-qwen4b-repin*.json."

  # ⚠ HONEST GAP: this model has NEVER been through the agent recall battery — it was the
  # setup-validation baseline, not a scored candidate. Its delegate role rests on throughput
  # evidence, not quality evidence. That is defensible for bulk prefill work and would NOT be
  # defensible if it were ever given agent/tool-calling work.
  # ⚠ Also note the portfolio was named as "Qwen3.6 4B"; what is on the box is Qwen3.5-4B.
  # A 3.6-generation 4B would be a fresh download and is untested.
  [models.qwen4b.serve]
  flags = ["-ngl 999", "-fa on", "--no-mmap", "--jinja", "-np 1", "-c 16384", "-ub 512", "--fit off", "--chat-template-kwargs {\"enable_thinking\":false}"]
  engine = "The pinned host binary, [[binaries]] llama-server, through the ${fork} macro and hatch-serving-guard – SINCE 2026-09-11. Until then production served this model from the kyuz0 vulkan-radv toolbox while every tagging measurement (2026-09-05, 09-09, 09-11) ran on the host binary through delegate-serve.sh, so the move aligns the serve with what was measured and removes `toolbox create` from the install. The flags are delegate-serve.sh's geometry; the router-served entry answered a thinking-off probe on the night of the move."
  note  = "Flags are what the box serves, verified against the running process. thinking OFF is load-bearing for tagging: Qwen defaults to thinking and burns the whole token budget on reasoning_content, returning empty tags (verified 2026-07-05). `--no-mmap` is the anonymous-vs-page-cache choice [models.qnext.serve].note spends a paragraph on, and is right here because 3 GiB is small enough that there is nothing worth reclaiming. ⚠ models-check.py compares DECLARED-INTO-RUNNING and cannot see an EXTRA flag on the serve; the [rejected] scan is what catches an extra flag that matters. That blind spot is how this key sat at the X1-era `-ngl 99 -fa on` with no `--no-mmap` for months while the llama-swap entry served otherwise (corrected 2026-09-09)."
  changes = "Fast and shallow, and it does not think – it answers straight out. That is what makes it right for chewing through a document backlog roughly twice as fast as the model it took the job from, and wrong for anything you would want reasoned about: asked to work a problem through, it does not produce a worse answer, it produces an empty one. It has never been measured on recall or tool-use at all, so treat any agent work on it as unknown rather than adequate."

  [models.qwen4b.pi]
  provider       = "local"
  context_window = 16384      # honest: the served -c, not the resident's window
  # Pi's global reserve of 16384 would leave this window a threshold of zero and compact after
  # every turn, so Pi's settings carry compaction.modelOverrides["local/qwen3.5-4b"] with these.
  compaction     = { reserve_tokens = 3072, keep_recent_tokens = 6000 }
  evidence = "Registered beside the resident on the same provider so the delegate direction of evaluations/agent/delegate-escalate-design.md has something to route to – it is the only direction left since ds4's escalation rung retired. Reached by its llama-swap id, not by a gguf filename: the router routes on what the request names."

